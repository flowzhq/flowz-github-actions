name: "Flowz CI Integration"
description: "Regenerate Flowz FSG/eFSG/system-view artifacts on every PR and push them to your .flowz-artifacts repo."
author: "flowzhq"
branding:
  icon: "git-branch"
  color: "purple"

# Composite action: everything runs on the CALLER's runner in one `uses:` step.
# The private flowz-ci / flowz (scanner) / fsg-enricher binaries are pulled from
# GHCR with a flowzhq-issued read:packages token (ADR-002) — the token is the
# access boundary; this public recipe carries no credentials. Artifacts-repo
# writes use a separate customer-org PAT, never the workflow's GITHUB_TOKEN.
#
# The CALLER's job must check out the repo first with `fetch-depth: 0`
# (change detection needs the merge-base with the target branch).

inputs:
  registry-user:
    description: "GHCR username for the flowzhq packages. Required unless flowz-ci-bin is set."
    required: false
  registry-token:
    description: "flowzhq-issued GHCR token with read:packages on flowz-ci, flowz-cli, and fsg-enricher. Pass a secret. Required unless flowz-ci-bin is set."
    required: false
  artifacts-token:
    description: "Customer-org PAT with contents:write on the artifacts repo. Pass a secret. Required unless dry-run."
    required: false
  license:
    description: "The CI license file Flowz issued you, base64-encoded (recommended: one line, masked exactly) or raw JSON. Pass a secret (secrets.FLOWZ_LICENSE). Written to a 0600 file under RUNNER_TEMP for the run step only and exported as FLOWZ_LICENSE. Required unless dry-run."
    required: false
    default: ""
  artifacts-repo:
    description: "Artifacts repo as owner/name (or full clone URL). Default: <owner>/.flowz-artifacts."
    required: false
    default: ""
  flowz-ci-version:
    description: "Tag of ghcr.io/flowzhq/flowz-ci. Pin a version in production; latest is a convenience mirror."
    required: false
    default: "latest"
  scanner-version:
    description: "Pinned tag of ghcr.io/flowzhq/flowz-cli (e.g. v0.4.0). Required for real runs; only dry-run works without it."
    required: false
    default: ""
  enricher-version:
    description: "Pinned tag of ghcr.io/flowzhq/fsg-enricher (e.g. v0.1.0; the -linux-amd64 platform tag is pulled). Required for real runs; only dry-run works without it."
    required: false
    default: ""
  scan-path:
    description: "Path to scan, relative to the workspace."
    required: false
    default: "."
  scan-mode:
    description: "Scan-mode override: single | monorepo | components. Blank uses the repo's .flowz.yml scan.mode (default monorepo). Lets a multi-FSG repo pick components/monorepo from the workflow with no committed .flowz.yml. Requires flowz-ci >= v0.5.0."
    required: false
    default: ""
  skip-change-check:
    description: "Run even when no source changed (true/false) — e.g. for workflow_dispatch reruns."
    required: false
    default: "false"
  dry-run:
    description: "Print the resolved context and planned pipeline without executing (true/false)."
    required: false
    default: "false"
  viewer-base-url:
    description: "flowz-viewer base URL used in the PR architecture comment's links. Override for self-hosted viewers."
    required: false
    default: "https://flowzhq.github.io/viewer"
  external-config-repo:
    description: "Config repo whose files to pull into the scan (owner/name or clone URL), e.g. an infra repo declaring shared config. Its files surface as ExternalFile nodes; nothing is committed to the scanned repo. (ADR-009)"
    required: false
    default: ""
  external-config-files:
    description: "Repo-relative files from external-config-repo to wire into the scan (comma/space separated)."
    required: false
    default: ""
  external-config-token:
    description: "Read token for a private external-config-repo. Pass a secret. Blank for a public config repo."
    required: false
    default: ""
  flowz-ci-bin:
    description: "Internal (CI self-test): path to a prebuilt flowz-ci binary; skips all GHCR pulls."
    required: false
    default: ""

outputs:
  skipped:
    description: "true when the PR contained no source changes and the pipeline was skipped."
    value: ${{ steps.run.outputs.skipped }}
  systems:
    description: "Comma-separated systems whose system-view was recomputed."
    value: ${{ steps.run.outputs.systems }}
  artifacts-branch:
    description: "The artifacts-repo branch that was written to."
    value: ${{ steps.run.outputs.artifacts-branch }}

runs:
  using: composite
  steps:
    - uses: oras-project/setup-oras@v1
      if: ${{ inputs.flowz-ci-bin == '' }}

    - name: Bootstrap flowz toolchain from GHCR
      if: ${{ inputs.flowz-ci-bin == '' }}
      shell: bash
      env:
        REGISTRY_USER: ${{ inputs.registry-user }}
        REGISTRY_TOKEN: ${{ inputs.registry-token }}
        FLOWZ_CI_VERSION: ${{ inputs.flowz-ci-version }}
        SCANNER_VERSION: ${{ inputs.scanner-version }}
        ENRICHER_VERSION: ${{ inputs.enricher-version }}
        DRY_RUN: ${{ inputs.dry-run }}
      run: bash "${{ github.action_path }}/scripts/bootstrap.sh"

    - name: Run flowz-ci
      id: run
      shell: bash
      env:
        FLOWZ_CI_BIN: ${{ inputs.flowz-ci-bin }}
        FLOWZ_CI_ARTIFACTS_TOKEN: ${{ inputs.artifacts-token }}
        FLOWZ_CI_ARTIFACTS_REPO: ${{ inputs.artifacts-repo }}
        FLOWZ_CI_VIEWER_BASE_URL: ${{ inputs.viewer-base-url }}
        # github.token, not secrets.GITHUB_TOKEN — composite actions can't read
        # secrets.*, but the github context flows in. Used only for the PR
        # architecture comment (needs permissions: pull-requests: write).
        GITHUB_TOKEN: ${{ github.token }}
        SCAN_PATH: ${{ inputs.scan-path }}
        # flowz-ci reads FLOWZ_CI_SCAN_MODE as the default for its --scan-mode flag; blank = no override.
        FLOWZ_CI_SCAN_MODE: ${{ inputs.scan-mode }}
        SKIP_CHANGE_CHECK: ${{ inputs.skip-change-check }}
        DRY_RUN: ${{ inputs.dry-run }}
        # External config injection (ADR-009): flowz-ci clones these files and
        # wires them into the scan via a generated flowz.config.json.
        FLOWZ_CI_EXTERNAL_CONFIG_REPO: ${{ inputs.external-config-repo }}
        FLOWZ_CI_EXTERNAL_CONFIG_FILES: ${{ inputs.external-config-files }}
        FLOWZ_CI_EXTERNAL_CONFIG_TOKEN: ${{ inputs.external-config-token }}
        # The license content; written to a file below and unset before flowz-ci runs.
        FLOWZ_LICENSE_INPUT: ${{ inputs.license }}
      run: |
        set -euo pipefail
        # flowz reads its license from the file FLOWZ_LICENSE names (exit 77
        # without one). write-license.sh accepts base64 (preferred) or raw JSON.
        # The file lives under RUNNER_TEMP, mode 0600, for this step only.
        if [ -n "$FLOWZ_LICENSE_INPUT" ] && [ "$DRY_RUN" != "true" ]; then
          lic="$(umask 077 && mktemp "${RUNNER_TEMP:-/tmp}/flowz-license.XXXXXX")"
          trap 'rm -f "$lic"' EXIT
          bash "${{ github.action_path }}/scripts/write-license.sh" "$lic"
          export FLOWZ_LICENSE="$lic"
        elif [ "$DRY_RUN" != "true" ]; then
          echo "::warning::no license input — flowz will refuse to run (exit 77). Pass license: secrets.FLOWZ_LICENSE (see the action README)."
        fi
        unset FLOWZ_LICENSE_INPUT
        # flowz-ci commits/rebases the artifacts repo via git. CI runners have no
        # default git identity, so the rebase-on-conflict path (two repos in a
        # system push to the shared artifacts repo concurrently) dies with
        # "empty ident name / Committer identity unknown". Set a fallback identity
        # here so every consumer is covered without a per-repo step. Only set it if
        # the caller hasn't already configured one.
        if ! git config --get user.email >/dev/null 2>&1; then
          git config --global user.email "flowz-ci-bot@users.noreply.github.com"
        fi
        if ! git config --get user.name >/dev/null 2>&1; then
          git config --global user.name "flowz-ci[bot]"
        fi
        bin="${FLOWZ_CI_BIN:-flowz-ci}"
        "$bin" version
        args=(run --repo-path "$SCAN_PATH")
        if [ "$DRY_RUN" = "true" ]; then args+=(--dry-run); fi
        if [ "$SKIP_CHANGE_CHECK" = "true" ]; then args+=(--skip-change-check); fi
        "$bin" "${args[@]}"

    - name: Notify the artifacts aggregator to recompute system-views
      # A system-view is a cross-repo aggregate: only the artifacts repo sees every
      # member's eFSG land, so it owns the recompute (its recompute-system-views
      # workflow, keyed by branch). This step tells it "this branch's eFSG set
      # changed" so it recomputes from the FULL set — that's what lets one repo's
      # PR view refresh as sibling repos land on the same branch.
      #
      # Non-blocking on purpose (like the PR comment): the run already pushed the
      # artifacts; a failed dispatch just means the view waits for the next eFSG
      # push or a manual run. Skips doc-only runs (nothing to recompute), non-PR
      # events, dry-runs, and the self-test path.
      if: ${{ inputs.flowz-ci-bin == '' && inputs.dry-run != 'true' && github.event_name == 'pull_request' && inputs.artifacts-token != '' && steps.run.outputs.skipped != 'true' }}
      shell: bash
      env:
        GH_TOKEN: ${{ inputs.artifacts-token }}      # PAT with write on the artifacts repo (repository_dispatch)
        ARTIFACTS_REPO: ${{ inputs.artifacts-repo }}
        OWNER: ${{ github.repository_owner }}
        BRANCH: ${{ steps.run.outputs.artifacts-branch }}
        REPO_NAME: ${{ github.event.repository.name }}
        PR_NUMBER: ${{ github.event.pull_request.number }}
      run: |
        set -uo pipefail
        target="${ARTIFACTS_REPO:-$OWNER/.flowz-artifacts}"
        # repository_dispatch needs an owner/name target; a full clone URL can't be dispatched to.
        case "$target" in
          *://* | */*/* ) echo "::notice::skipping aggregator dispatch — artifacts-repo '$target' is not owner/name"; exit 0 ;;
        esac
        if [ -z "$BRANCH" ]; then echo "::notice::no artifacts branch to recompute — skipping dispatch"; exit 0; fi
        body="$(jq -n --arg b "$BRANCH" --arg r "$REPO_NAME" --arg pr "$PR_NUMBER" \
          '{event_type:"efsg-updated", client_payload:{branch:$b, repo:$r, pr:$pr}}')"
        if printf '%s' "$body" | gh api "repos/$target/dispatches" --input - ; then
          echo "dispatched efsg-updated → $target (branch=$BRANCH repo=$REPO_NAME pr=#$PR_NUMBER)"
        else
          echo "::warning::aggregator dispatch to $target failed — system-views will recompute on the next eFSG push or a manual run"
        fi
